[project]
name = "codeagent"
version = "0.1.0"
description = "A small, honest coding agent that turns an issue into a verified patch inside a sandbox."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
codeagent = "codeagent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
